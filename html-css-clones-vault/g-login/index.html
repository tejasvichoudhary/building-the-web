<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Noto+Sans+Meroitic&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Google Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Create an account</h1>
    <div class="button1">
        <img src="google.icon" alt="">
        <a href="">Sign up with Google</a>
    </div>
    <div class="name"><p>Email</p></div>
    <div class="email">
        <input type="email" id="Em">
    </div>
    <div class="name"><p>Password</p></div>
    <div class="pass">
        <input type="password" id="Ps">
        <i class="fa-solid fa-eye"></i>
    </div>
    <div class="button2">
        <p>Sign up</p>
    </div>
    <div class="option" >
        Already registered?
     <a href="#"> <span>Sign in</span></a>
     </div> 
     <div class="end">
    <p> By continuing,you agree to our <span>Terms of Service</span> and <span>Privacy policy</span></p>
</div> 
</div>

</body>
</html>
